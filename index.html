<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>回声大陆 · Echo Continent</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <!-- 标题画面 -->
  <div id="title-screen">
    <div class="title-inner">
      <div class="title-logo">回声大陆</div>
      <div class="title-sub">ECHO CONTINENT · 第六纪元「残响」· 最后十年</div>
      <div class="title-quote">「这一次，别再迟到。」</div>
      <div class="title-btns">
        <button id="btn-new" class="big-btn">新的纪元</button>
        <button id="btn-continue" class="big-btn ghost">继续（读取存档）</button>
      </div>
      <div class="title-foot">v0.4 · 序章「灰烬原野」 · 像素风 · 键盘 WASD/方向键移动 · E 互动 · 触屏有虚拟摇杆</div>
    </div>
  </div>

  <!-- 游戏画面 -->
  <div id="game-screen" class="hidden">
    <div id="hud">
      <div class="hud-plate">
        <div class="hud-avatar"><img id="hud-face" alt=""></div>
        <div class="hud-info">
          <div class="hud-row1"><span class="hud-name">余音之子</span><span class="lv-badge">Lv.<b id="hud-level">1</b></span></div>
          <div class="xpbar"><div id="hud-xpfill"></div></div>
          <div class="hud-notes">♪ 纯正音符 <b id="hud-notes">0</b>/3</div>
        </div>
      </div>
      <div class="hud-right">
        <div class="pill" title="弦币"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#d8b25c" stroke="#8a6d2f" stroke-width="1.6"/><rect x="8.4" y="8.4" width="7.2" height="7.2" fill="none" stroke="#8a6d2f" stroke-width="1.6"/></svg><b id="hud-coins">0</b></div>
        <div class="pill" title="共鸣结晶"><svg viewBox="0 0 24 24"><path d="M12 2 L20 10 L12 22 L4 10 Z" fill="#9fd8e8" stroke="#4a7d94" stroke-width="1.4"/><path d="M4 10 H20 M12 2 L8.5 10 L12 22 L15.5 10" fill="none" stroke="#4a7d94" stroke-width="1"/></svg><b id="hud-crystals">0</b></div>
        <div class="pill" title="回声碎片"><svg viewBox="0 0 24 24"><path d="M13 2 L20 13 L10 22 L4 9 Z" fill="#c9b8e8" stroke="#6a5594" stroke-width="1.4"/></svg><b id="hud-shards">0</b></div>
        <button id="btn-gacha" class="icon-btn"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2" fill="#c9a86a"/><circle cx="12" cy="12" r="6.8" fill="none" stroke="#c9a86a" stroke-width="1.7"/><circle cx="12" cy="12" r="10" fill="none" stroke="#c9a86a" stroke-width="1.2" opacity=".55"/></svg><span>共鸣</span></button>
        <button id="btn-party" class="icon-btn"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.4" fill="#c9a86a"/><path d="M3 20 C3 15.5 5.8 13.5 9 13.5 C12.2 13.5 15 15.5 15 20 Z" fill="#c9a86a"/><circle cx="17" cy="9" r="2.6" fill="#c9a86a" opacity=".65"/><path d="M16.4 13.6 C18.9 13.9 21 15.7 21 20 L15.8 20 C15.7 17.3 16 15.2 16.4 13.6 Z" fill="#c9a86a" opacity=".65"/></svg><span>队伍</span></button>
        <button id="btn-save" class="icon-btn"><svg viewBox="0 0 24 24"><path d="M6 3 H18 V21 L12 16.6 L6 21 Z" fill="none" stroke="#c9a86a" stroke-width="1.8"/></svg><span>存档</span></button>
      </div>
    </div>
    <div id="objective">目标：<span id="objective-text"></span></div>
    <div id="canvas-wrap">
      <canvas id="cv" width="960" height="600"></canvas>
      <div id="toast" class="hidden"></div>
    </div>
    <div id="dialog" class="hidden">
      <img id="dialog-face" alt="">
      <div id="dialog-who"></div>
      <div id="dialog-text"></div>
      <div id="dialog-next">▼ 点击 / 按 E 继续</div>
    </div>
    <!-- 触屏控制 -->
    <div id="touch-ui">
      <div id="joystick"><div id="joy-knob"></div></div>
      <button id="btn-act">互动</button>
    </div>
  </div>

  <!-- 战斗画面 -->
  <div id="battle-screen" class="hidden">
    <div id="battle-stage">
      <div id="battle-enemies"></div>
      <div id="battle-party"></div>
    </div>
    <div id="battle-log"></div>
    <div id="battle-actions"></div>
  </div>

  <!-- 共鸣（全屏） -->
  <div id="gacha-screen" class="screen hidden">
    <div class="screen-head">
      <div class="screen-title">共 鸣 <span>RESONANCE</span></div>
      <div class="screen-head-right">
        <div class="pill light"><svg viewBox="0 0 24 24"><path d="M12 2 L20 10 L12 22 L4 10 Z" fill="#9fd8e8" stroke="#4a7d94" stroke-width="1.4"/></svg><b id="gacha-crystals">0</b></div>
        <button class="x-btn" id="gacha-close">×</button>
      </div>
    </div>
    <div class="gacha-body">
      <div class="gacha-hero">
        <div id="gacha-hero-art"></div>
        <div id="gacha-pool-name"></div>
        <div id="gacha-pool-desc"></div>
      </div>
      <div class="gacha-side">
        <div class="gacha-tabs">
          <button id="tab-char" class="tab-btn">角色池</button>
          <button id="tab-weapon" class="tab-btn">专武池</button>
        </div>
        <div id="gacha-results"></div>
        <div id="gacha-list"></div>
        <div class="gacha-actions">
          <div id="gacha-pity"></div>
          <div class="wish-btns">
            <button id="pull1" class="wish-btn">共鸣 ×1</button>
            <button id="pull10" class="wish-btn gold">共鸣 ×10</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 队伍（全屏） -->
  <div id="party-screen" class="screen hidden">
    <div class="screen-head">
      <div class="screen-title">队 伍 <span>PARTY</span></div>
      <div class="screen-head-right"><button class="x-btn" id="party-close">×</button></div>
    </div>
    <div class="party-body">
      <div id="party-list"></div>
      <div id="party-detail"></div>
    </div>
  </div>

  <!-- 通用面板（商店等） -->
  <div id="panel" class="hidden">
    <div id="panel-box">
      <div id="panel-head"><span id="panel-title"></span><button id="panel-close">×</button></div>
      <div id="panel-body"></div>
    </div>
  </div>

  <!-- 结算 / 提示弹窗 -->
  <div id="modal" class="hidden">
    <div id="modal-box">
      <div id="modal-title"></div>
      <div id="modal-body"></div>
      <button id="modal-ok" class="big-btn">好</button>
    </div>
  </div>
</div>
<script src="js/sprites.js"></script>
<script src="js/data.js"></script>
<script src="js/battle.js"></script>
<script src="js/gacha.js"></script>
<script src="js/world.js"></script>
</body>
</html>
